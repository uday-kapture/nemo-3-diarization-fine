[project]
name = "nemo-3-diarization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uday-kapture", email = "uday.sharma@kapturecrm.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "scipy", "soundfile", "silero-vad", "huggingface_hub", "peft", "torch", "pyannote.metrics"]

[project.optional-dependencies]
train = ["nemo-toolkit[asr]>=3.0.0"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
diar-prepare = "nemo_3_diarization.prepare:main"
diar-prod-testset = "nemo_3_diarization.prod_testset:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
